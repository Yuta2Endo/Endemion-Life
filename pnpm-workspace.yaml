packages:
  - apps/*
  - packages/*

# Одни версии инструментов во всех пакетах: в package.json пишется "catalog:"
catalog:
  typescript: 6.0.3
  "@types/node": 24.19.2
  vitest: 5.0.5
  zod: 4.6.7
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  prisma: 7.10.1
  "@prisma/client": 7.10.1
  "@prisma/adapter-pg": 7.10.1

# Пакеты, которым разрешены install-скрипты (остальным pnpm их не запускает)
allowBuilds:
  "@prisma/engines": true
  prisma: true
  esbuild: true
  "@swc/core": true
  "@nestjs/core": false
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - "@next/env@16.4.4"
  - "@next/eslint-plugin-next@16.4.4"
  - "@next/swc-darwin-arm64@16.4.4"
  - "@next/swc-darwin-x64@16.4.4"
  - "@next/swc-linux-arm64-gnu@16.4.4"
  - "@next/swc-linux-arm64-musl@16.4.4"
  - "@next/swc-linux-x64-gnu@16.4.4"
  - "@next/swc-linux-x64-musl@16.4.4"
  - "@next/swc-win32-arm64-msvc@16.4.4"
  - "@next/swc-win32-x64-msvc@16.4.4"
  - eslint-config-next@16.4.4
  - next@16.4.4
