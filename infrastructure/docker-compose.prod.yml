# Рабочая среда Endemion Life: PostgreSQL, Redis, миграции, API, сайт, Nginx (HTTPS), certbot,
# резервное копирование и монитор доступности.
#
# Запуск из корня проекта:
#   docker compose -f infrastructure/docker-compose.prod.yml --env-file .env up -d --build
# Образец .env: infrastructure/env.production.example. Пошагово: docs/DEPLOYMENT.md
#
# NGINX_MODE=tls (по умолчанию) — Nginx сам получает сертификат Let's Encrypt и слушает 80 и 443.
# NGINX_MODE=behind-proxy — HTTPS завершает внешний прокси (Caddy на общем сервере):
#   добавьте -f infrastructure/docker-compose.behind-proxy.yml (docs/HTTPS_SETUP.md)
name: endemion-life-prod

# Ротация журналов контейнеров: не больше 5 файлов по 10 МБ на сервис
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-env: &app-env
  NODE_ENV: production
  # Пароль базы должен состоять из символов, допустимых в URL без кодирования: [A-Za-z0-9_-]
  DATABASE_URL: postgresql://${POSTGRES_USER:?Задайте POSTGRES_USER}:${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Задайте POSTGRES_DB}
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Применяет миграции и завершается. API стартует только после успешного выполнения
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
      target: migrate
    logging: *logging
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    logging: *logging
    environment:
      <<: *app-env
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DOMAIN:?Задайте DOMAIN}}
      PUBLIC_URL: ${PUBLIC_URL:-https://${DOMAIN}}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
      # Cookie только по HTTPS. false допустимо лишь для проверки без сертификата
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Nginx — соседний контейнер в частной сети Docker
      TRUST_PROXY: loopback, uniquelocal
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Endemion Life <no-reply@endemion.online>}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Вход через Endemion ID (auth.endemion.online). false — старый вход по почте, см. docs/ENDEMION_ID.md
      ENDEMION_ID: ${ENDEMION_ID:-false}
      ENDEMION_ID_ISSUER: ${ENDEMION_ID_ISSUER:-}
      ENDEMION_ID_CLIENT_ID: ${ENDEMION_ID_CLIENT_ID:-}
      ENDEMION_ID_CLIENT_SECRET: ${ENDEMION_ID_CLIENT_SECRET:-}
      ENDEMION_ID_TOKEN_KEY: ${ENDEMION_ID_TOKEN_KEY:-}
      # Portal profile API (dark by default; activation requires an approved Portal JWKS)
      PORTAL_INTEGRATION_ENABLED: ${PORTAL_INTEGRATION_ENABLED:-false}
      PORTAL_JWT_ISSUER: ${PORTAL_JWT_ISSUER:-}
      PORTAL_JWT_AUDIENCE: ${PORTAL_JWT_AUDIENCE:-}
      PORTAL_JWKS_URL: ${PORTAL_JWKS_URL:-}
      PORTAL_JWKS_CACHE_TTL_SECONDS: ${PORTAL_JWKS_CACHE_TTL_SECONDS:-300}
      PORTAL_JWKS_TIMEOUT_MS: ${PORTAL_JWKS_TIMEOUT_MS:-3000}
      PORTAL_JWKS_MIN_REFRESH_MS: ${PORTAL_JWKS_MIN_REFRESH_MS:-10000}
      PORTAL_JWKS_BLOCKED_KIDS: ${PORTAL_JWKS_BLOCKED_KIDS:-}
      PORTAL_SUBJECT_RATE_LIMIT_PER_MINUTE: ${PORTAL_SUBJECT_RATE_LIMIT_PER_MINUTE:-60}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4

  web:
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    logging: *logging
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4

  nginx:
    build:
      context: ..
      dockerfile: infrastructure/nginx/Dockerfile
    restart: unless-stopped
    logging: *logging
    environment:
      NGINX_MODE: ${NGINX_MODE:-tls}
      DOMAIN: ${DOMAIN}
      # 0 — HSTS выключен. Включайте (63072000 = 2 года) только после проверки HTTPS: docs/HTTPS_SETUP.md
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-0}
      PUBLIC_HTTPS_PORT: ${HTTPS_PORT:-443}
      NGINX_API_RATE: ${NGINX_API_RATE:-30r/s}
      NGINX_AUTH_RATE: ${NGINX_AUTH_RATE:-30r/m}
      REAL_IP_FROM: ${REAL_IP_FROM:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

  # Продление сертификата: проверка дважды в сутки, продление за 30 дней до окончания.
  # Nginx подхватывает новый сертификат сам (перечитывает его раз в 6 часов)
  certbot:
    image: certbot/certbot:v5.9.0
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

  # Резервное копирование PostgreSQL по расписанию. Копии — на диске сервера (BACKUP_HOST_DIR),
  # не в контейнере базы. Ручной запуск: docker compose … exec backup backup.sh
  backup:
    build:
      context: ..
      dockerfile: infrastructure/backup/Dockerfile
    restart: unless-stopped
    logging: *logging
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      TZ: ${BACKUP_TZ:-UTC}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-30 3 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_KEEP_MIN: ${BACKUP_KEEP_MIN:-7}
      BACKUP_VERIFY_FULL: ${BACKUP_VERIFY_FULL:-true}
      BACKUP_S3_REMOTE: ${BACKUP_S3_REMOTE:-}
      RCLONE_CONFIG_BACKUP_TYPE: ${RCLONE_CONFIG_BACKUP_TYPE:-s3}
      RCLONE_CONFIG_BACKUP_PROVIDER: ${RCLONE_CONFIG_BACKUP_PROVIDER:-Other}
      RCLONE_CONFIG_BACKUP_ENDPOINT: ${RCLONE_CONFIG_BACKUP_ENDPOINT:-}
      RCLONE_CONFIG_BACKUP_REGION: ${RCLONE_CONFIG_BACKUP_REGION:-}
      RCLONE_CONFIG_BACKUP_ACCESS_KEY_ID: ${RCLONE_CONFIG_BACKUP_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_BACKUP_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_BACKUP_SECRET_ACCESS_KEY:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_FORMAT: ${ALERT_WEBHOOK_FORMAT:-slack}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      HEALTHCHECKS_BACKUP_PING_URL: ${HEALTHCHECKS_BACKUP_PING_URL:-}
    volumes:
      - ${BACKUP_HOST_DIR:-../backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy

  # Монитор доступности: /api/health внутри сети и (необязательно) публичный адрес; оповещения в webhook
  monitor:
    build:
      context: ..
      dockerfile: infrastructure/monitor/Dockerfile
    restart: unless-stopped
    logging: *logging
    environment:
      MONITOR_URL: http://api:4000/api/health
      MONITOR_PUBLIC_URL: ${MONITOR_PUBLIC_URL:-}
      MONITOR_INTERVAL: ${MONITOR_INTERVAL:-60}
      MONITOR_FAILURES: ${MONITOR_FAILURES:-3}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_FORMAT: ${ALERT_WEBHOOK_FORMAT:-slack}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      HEALTHCHECKS_PING_URL: ${HEALTHCHECKS_PING_URL:-}
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  certbot-www:
  letsencrypt:
