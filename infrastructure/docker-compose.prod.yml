# Рабочая среда: PostgreSQL, Redis, миграции, API, сайт и Nginx на порту 80.
# Запуск из корня проекта:
#   docker compose -f infrastructure/docker-compose.prod.yml --env-file .env up -d --build
# Обязательные переменные в .env: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, CORS_ORIGINS (адрес сайта)
# HTTPS появится на Stage 02. До этого COOKIE_SECURE=false: иначе браузер не сохранит cookie по HTTP
name: endemion-life-prod

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:?Задайте POSTGRES_USER}:${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Задайте POSTGRES_DB}
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Применяет миграции и завершается. API стартует только после успешного выполнения
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
      target: migrate
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      <<: *app-env
      CORS_ORIGINS: ${CORS_ORIGINS:?Задайте CORS_ORIGINS — адрес сайта, например http://life.endemion.online}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Nginx — соседний контейнер в частной сети Docker
      TRUST_PROXY: loopback, uniquelocal
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

volumes:
  postgres-data:
  redis-data:
