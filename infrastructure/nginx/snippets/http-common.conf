# Общие настройки уровня http: апстримы, лимиты, формат журнала. Подключается в начале каждого шаблона

upstream endemion_web {
  server web:3000;
  keepalive 16;
}

upstream endemion_api {
  server api:4000;
  keepalive 16;
}

limit_req_status 429;
limit_req_log_level warn;

server_tokens off;

# Журнал в JSON, одна строка на запрос. Пишется путь без строки запроса ($uri):
# токены из ссылок (например, восстановления пароля) в журнал не попадают
log_format endemion_json escape=json
  '{"time":"$time_iso8601","level":"info","context":"nginx","msg":"request",'
  '"requestId":"$request_id","method":"$request_method","path":"$uri","status":$status,'
  '"durationSec":$request_time,"upstreamSec":"$upstream_response_time","bytes":$body_bytes_sent,'
  '"ip":"$remote_addr","userAgent":"$http_user_agent"}';
