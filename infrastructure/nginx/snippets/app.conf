# Маршруты сайта: /api/* — в API, остальное — в Next.js. Подключается в server с HTTPS или за внешним прокси
client_max_body_size 32k;
access_log /dev/stdout endemion_json;

gzip on;
gzip_vary on;
gzip_types text/plain text/css application/json application/javascript image/svg+xml;

# Чтение состояния входа и переходы через Endemion ID: их делает каждая страница, поэтому общий лимит API.
# Под строгим лимитом ниже они упирались в 429 после пары выходов и входов, а сайт писал «Нет связи с сервером».
# Точное совпадение (=) и более длинный префикс важнее ^~ /api/auth/
location = /api/auth/me {
  include /etc/nginx/snippets/security-headers.conf;
  limit_req zone=endemion_api burst=60 nodelay;
  proxy_pass http://endemion_api;
  include /opt/endemion/snippets/proxy-headers.conf;
  proxy_read_timeout 30s;
}

location = /api/auth/config {
  include /etc/nginx/snippets/security-headers.conf;
  limit_req zone=endemion_api burst=60 nodelay;
  proxy_pass http://endemion_api;
  include /opt/endemion/snippets/proxy-headers.conf;
  proxy_read_timeout 30s;
}

location = /api/auth/sessions {
  include /etc/nginx/snippets/security-headers.conf;
  limit_req zone=endemion_api burst=60 nodelay;
  proxy_pass http://endemion_api;
  include /opt/endemion/snippets/proxy-headers.conf;
  proxy_read_timeout 30s;
}

location ^~ /api/auth/oidc/ {
  include /etc/nginx/snippets/security-headers.conf;
  limit_req zone=endemion_api burst=60 nodelay;
  proxy_pass http://endemion_api;
  include /opt/endemion/snippets/proxy-headers.conf;
  proxy_read_timeout 30s;
}

# Вход, регистрация, коды и восстановление: отдельный, более строгий лимит (API ограничивает ещё и по почте)
location ^~ /api/auth/ {
  include /etc/nginx/snippets/security-headers.conf;
  limit_req zone=endemion_auth burst=10 nodelay;
  proxy_pass http://endemion_api;
  include /opt/endemion/snippets/proxy-headers.conf;
  proxy_read_timeout 30s;
}

# Stage 04: перенос жизни из браузера — состояние и история целиком (до ~460 КБ у тысячелетней жизни).
# Больший лимит только здесь; тот же предел — в API (bootstrap.ts, IMPORT_BODY_LIMIT)
location = /api/lives/import {
  include /etc/nginx/snippets/security-headers.conf;
  client_max_body_size 2m;
  limit_req zone=endemion_api burst=10 nodelay;
  proxy_pass http://endemion_api;
  include /opt/endemion/snippets/proxy-headers.conf;
  proxy_read_timeout 30s;
}

location /api/ {
  include /etc/nginx/snippets/security-headers.conf;
  limit_req zone=endemion_api burst=60 nodelay;
  proxy_pass http://endemion_api;
  include /opt/endemion/snippets/proxy-headers.conf;
  proxy_read_timeout 30s;
}

location /_next/static/ {
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  proxy_pass http://endemion_web;
  include /opt/endemion/snippets/proxy-headers.conf;
}

location / {
  include /etc/nginx/snippets/security-headers.conf;
  proxy_pass http://endemion_web;
  include /opt/endemion/snippets/proxy-headers.conf;
}
