# Заголовки для API и сайта. X-Forwarded-For заменяется адресом клиента, а не дописывается:
# подставить чужой IP через свой заголовок нельзя
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $endemion_proto;
# Один идентификатор запроса в журнале Nginx и в журнале API
proxy_set_header X-Request-Id $request_id;
# Эти заголовки Nginx ставит сам (security-headers.conf): одинаковые заголовки от API и Next.js скрываются, чтобы не было дублей
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header X-Frame-Options;
proxy_hide_header Permissions-Policy;
