# Nginx перед сайтом и API в рабочей среде (infrastructure/docker-compose.prod.yml).
# Браузер ходит на один адрес: /api/* — в API, остальное — в Next.js. Cookie сессии остаётся first-party.
# HTTPS (сертификат) настраивается на Stage 02: до этого compose открывает только порт 80

upstream endemion_web {
  server web:3000;
  keepalive 16;
}

upstream endemion_api {
  server api:4000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 32k;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  location /api/ {
    proxy_pass http://endemion_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location /_next/static/ {
    proxy_pass http://endemion_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://endemion_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
